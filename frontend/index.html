    <!-- Core Web Vitals: warm up the DNS/TLS connection to the API origin before the JS bundle
         even starts fetching from it -- ReviewsSection (below the fold, but still one of the
         first fetches the app makes) and the auth flow both hit api.mrreadyprep.com immediately
         on mount. Without this the browser only discovers that origin once it parses/executes
         the bundle and issues the first fetch(), paying DNS+TCP+TLS setup cost on the critical
         path of that request instead of in parallel with page load. -->
    <link rel="preconnect" href="https://api.mrreadyprep.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mrreadyprep.com" />

    <!-- GEO: FAQPage schema mirrors the exact Q&A copy rendered in App.jsx's `faqs` array (the
         accordion under "Frequently asked questions" on the landing page) -- this is the single
         most valuable structured-data addition for AI answer engines (ChatGPT, Perplexity,
         Google AI Overviews), since FAQPage is one of the few schema types they're documented to
         pull direct answers/citations from. Keep this block in sync if App.jsx's faqs array
         changes -- a mismatch between the schema and the visible page text is exactly what these
         schemas are meant NOT to have. -->
    <script type="application/ld+json">

          }
        },

          "@type": "Question",

            "@type": "Answer",
            "text": "Each of the 20 mock exams mirrors real test timing and section transitions across Reading, Listening, Writing, and Speaking, and ends with a full band report plus a mistake review."
