name: Cron Jobs

# Nurture emails are scheduled separately on Render (nurture-emails-daily),
# so they are intentionally not triggered from here.
on:
  schedule:
    - cron: '0 */8 * * *'
    - cron: '0 2 * * *'

jobs:
  practice-reminders:
    if: github.event.schedule == '0 */8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send practice reminders
        run: |
          curl -fsS -X POST https://mrreadyprep.onrender.com/api/cron/practice-reminders \
            -H "X-Cron-Secret: ${{ secrets.PRACTICE_REMINDER_CRON_SECRET }}" \
            -H "Content-Type: application/json"

  seo-check:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO check
        run: |
          curl -fsS -X POST https://mrreadyprep.onrender.com/api/cron/seo-check \
            -H "X-Cron-Secret: ${{ secrets.SEO_CRON_SECRET }}" \
            -H "Content-Type: application/json"
