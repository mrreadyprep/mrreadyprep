name: Cron Jobs

# Practice reminders and nurture emails are scheduled on Render
# (practice-reminder, nurture-emails-daily), so only the SEO check runs here.
on:
  schedule:
    - cron: '0 2 * * *'

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO check
        run: |
          curl -fsS -X POST https://mrreadyprep.onrender.com/api/cron/seo-check \
            -H "X-Cron-Secret: ${{ secrets.SEO_CRON_SECRET }}" \
            -H "Content-Type: application/json"
